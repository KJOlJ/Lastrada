name: Deploy Firebase Hosting

on:
  push:
    branches: [feat/firebase-web]
    paths:
      - web/public/**
      - firebase.json
      - .firebaserc
      - .github/workflows/deploy-firebase-hosting.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting-lastrada-alt
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out validated frontend
        uses: actions/checkout@v4

      - name: Select Firebase credentials
        id: auth
        shell: bash
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LASTRADA_64BAB || secrets.FIREBASE_SERVICE_ACCOUNT || secrets.GCP_SA_KEY || secrets.GOOGLE_CREDENTIALS || secrets.GCP_CREDENTIALS }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${FIREBASE_SA}" ]; then
            printf '%s' "${FIREBASE_SA}" > "${RUNNER_TEMP}/firebase-service-account.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=${RUNNER_TEMP}/firebase-service-account.json" >> "${GITHUB_ENV}"
            echo "mode=service-account" >> "${GITHUB_OUTPUT}"
          elif [ -n "${FIREBASE_TOKEN}" ]; then
            echo "mode=token" >> "${GITHUB_OUTPUT}"
          else
            echo "No Firebase deployment credential is configured in GitHub Actions." >&2
            echo "Add FIREBASE_SERVICE_ACCOUNT_LASTRADA_64BAB or FIREBASE_TOKEN as a repository secret." >&2
            exit 1
          fi

      - name: Build configuration for the new Firebase app
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 4 \
            "https://lastrada-64bab.web.app/config.json" \
            --output /tmp/current-live-config.json
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path('/tmp/current-live-config.json').read_text())
          api_base = source.get('apiBase')
          if not api_base or not str(api_base).startswith('https://'):
              raise SystemExit('The existing live config did not contain a valid Cloud Run apiBase')

          config = {
              'firebase': {
                  'apiKey': 'AIzaSyBoxFP_8MOTkkoFGO2DOz9Mw39VhzA_2F4',
                  'authDomain': 'lastrada-64bab.firebaseapp.com',
                  'projectId': 'lastrada-64bab',
                  'storageBucket': 'lastrada-64bab.firebasestorage.app',
                  'messagingSenderId': '471058014767',
                  'appId': '1:471058014767:web:9b99b922f532c81db5dcda',
                  'measurementId': 'G-727C6WV31X',
              },
              'apiBase': api_base,
          }
          Path('web/public/config.json').write_text(json.dumps(config, indent=2) + '\n')
          Path('/tmp/api-base.txt').write_text(str(api_base))
          PY
          python -m json.tool web/public/config.json >/dev/null
          echo "LASTRADA_API_BASE=$(cat /tmp/api-base.txt)" >> "${GITHUB_ENV}"

      - name: Set up Google Cloud CLI
        if: steps.auth.outputs.mode == 'service-account'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: lastrada-64bab

      - name: Authorize the new Hosting origin and set practical testing limits
        if: steps.auth.outputs.mode == 'service-account'
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="${GOOGLE_APPLICATION_CREDENTIALS}"
          gcloud config set project lastrada-64bab

          ORIGINS="https://lastrada-64bab.web.app,https://lastrada-64bab.firebaseapp.com,https://lastrada-alt.web.app,https://lastrada-alt.firebaseapp.com"
          gcloud run services update lastrada-api \
            --project lastrada-64bab \
            --region us-central1 \
            --update-env-vars="^@^LASTRADA_ORIGINS=${ORIGINS}@LASTRADA_USER_DAILY_JOBS=25@LASTRADA_DAILY_JOBS=200" \
            --quiet

          cat > /tmp/cors.json <<'JSON'
          [
            {
              "origin": [
                "https://lastrada-64bab.web.app",
                "https://lastrada-64bab.firebaseapp.com",
                "https://lastrada-alt.web.app",
                "https://lastrada-alt.firebaseapp.com"
              ],
              "method": ["PUT", "POST", "GET", "HEAD"],
              "responseHeader": ["Content-Type", "Location", "Range", "ETag"],
              "maxAgeSeconds": 3600
            }
          ]
          JSON
          gcloud storage buckets update \
            gs://lastrada-64bab-lastrada-cases \
            --cors-file=/tmp/cors.json

      - name: Verify the Cloud Run CORS preflight
        if: steps.auth.outputs.mode == 'service-account'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --request OPTIONS \
            --header "Origin: https://lastrada-alt.web.app" \
            --header "Access-Control-Request-Method: POST" \
            --header "Access-Control-Request-Headers: authorization,content-type" \
            --dump-header /tmp/cors-headers.txt \
            --output /dev/null \
            "${LASTRADA_API_BASE}/api/analyses"
          grep -qi '^access-control-allow-origin: https://lastrada-alt.web.app' /tmp/cors-headers.txt

      - name: Deploy Hosting to lastrada-alt
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          AUTH_MODE: ${{ steps.auth.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "${AUTH_MODE}" = "token" ]; then
            npx --yes firebase-tools@15.4.0 deploy \
              --only hosting \
              --project lastrada-64bab \
              --config firebase.json \
              --token "${FIREBASE_TOKEN}" \
              --non-interactive
          else
            npx --yes firebase-tools@15.4.0 deploy \
              --only hosting \
              --project lastrada-64bab \
              --config firebase.json \
              --non-interactive
          fi

      - name: Verify the new Firebase site
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "https://lastrada-alt.web.app/grouped-timestamps.js?revision=${GITHUB_SHA}" \
            --output /tmp/grouped-timestamps.js
          grep -q "Matched derivative timestamps" /tmp/grouped-timestamps.js
          curl --fail --silent --show-error --retry 5 --retry-delay 3 \
            "https://lastrada-alt.web.app/config.json?revision=${GITHUB_SHA}" \
            --output /tmp/config.json
          grep -q '1:471058014767:web:9b99b922f532c81db5dcda' /tmp/config.json
          {
            echo "### Firebase Hosting deployed"
            echo "https://lastrada-alt.web.app"
            echo ""
            echo "The new Hosting origin is authorized for the Cloud Run API and signed uploads."
            echo "Testing limits are 25 operations per user and 200 shared operations per UTC day."
            echo "Sony, DTW, Demucs and stored analysis behavior were not changed."
          } >> "${GITHUB_STEP_SUMMARY}"
